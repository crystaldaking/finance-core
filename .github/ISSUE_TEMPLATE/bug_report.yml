name: Bug report
description: Report a correctness, DX, documentation, or packaging bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code sample that reproduces the issue.
      render: php
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.5.x"
    validations:
      required: true
