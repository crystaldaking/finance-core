name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_CACHE_DIR: /tmp/finance-core-composer-cache

jobs:
  qa:
    name: QA (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - highest
          - lowest-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Prefer lowest runtime dependencies
        if: matrix.dependencies == 'lowest-runtime'
        run: composer update brick/math psr/clock --prefer-lowest --prefer-stable --with-dependencies --no-interaction --no-progress

      - name: QA
        run: composer qa

      - name: Audit dependencies
        run: composer audit --locked

      - name: Coverage
        if: matrix.dependencies == 'highest'
        run: composer coverage

      - name: Upload coverage artifact
        if: matrix.dependencies == 'highest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build/coverage

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Mutation testing
        run: composer mutation

      - name: Upload mutation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: build/infection

  compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Compare public API with the previous release
        run: |
          mkdir -p "$RUNNER_TEMP/roave"
          composer --working-dir="$RUNNER_TEMP/roave" require roave/backward-compatibility-check:8.27.0 --no-interaction --no-progress
          baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          "$RUNNER_TEMP/roave/vendor/bin/roave-backward-compatibility-check" --from="$baseline" --to=HEAD --format=github-actions

  runtime:
    name: Runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            experimental: false
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Check declared runtime dependencies
        if: matrix.php == '8.5'
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/composer-require-checker.phar" \
            https://github.com/maglnet/ComposerRequireChecker/releases/download/4.24.0/composer-require-checker.phar
          echo "35d1dfdd7aa94a750f4b4c9b0b22dd5e76b5e9e35fb910c8901f3dafd2ad2ab9  $RUNNER_TEMP/composer-require-checker.phar" | sha256sum --check
          php "$RUNNER_TEMP/composer-require-checker.phar" check composer.json

      - name: Run examples with runtime-only dependencies
        run: |
          for example in examples/*.php; do
            php "$example"
          done
